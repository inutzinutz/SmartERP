version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smarterp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: smarterp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (for sessions & caching)
  redis:
    image: redis:7-alpine
    container_name: smarterp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: smarterp-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/smarterp?schema=public
      JWT_SECRET: smarterp-production-secret-key-change-me
      JWT_EXPIRATION: 7d
      APP_PORT: 3000
      APP_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: smarterp-web
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
